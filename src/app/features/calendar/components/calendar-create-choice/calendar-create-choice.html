<div class="cc-overlay" (click)="cancel.emit()">
  <div
    class="cc-card"
    role="dialog"
    aria-modal="true"
    aria-label="Que voulez-vous planifier ?"
    (click)="$event.stopPropagation()">

    <header class="cc-head">
      <span class="eyebrow">{{ dateLabel() }}</span>
      <h2 class="cc-title">Que voulez-vous planifier ?</h2>
    </header>

    <div class="cc-choices">
      <button type="button" class="cc-choice cc-choice--outreach" (click)="choose.emit('OUTREACH')" autofocus>
        <span class="cc-choice__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.4"/></svg>
        </span>
        <span class="cc-choice__body">
          <span class="cc-choice__name">Évangélisation</span>
          <span class="cc-choice__hint">Une sortie sur le terrain, avec ses présences et ses contacts.</span>
        </span>
        <svg class="cc-choice__go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <button type="button" class="cc-choice cc-choice--event" (click)="choose.emit('EVENT')">
        <span class="cc-choice__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
        </span>
        <span class="cc-choice__body">
          <span class="cc-choice__name">Événement</span>
          <span class="cc-choice__hint">Une réunion, une agapè ou tout autre rendez-vous du département.</span>
        </span>
        <svg class="cc-choice__go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <footer class="cc-foot">
      <button type="button" class="btn cc-cancel" (click)="cancel.emit()">Annuler</button>
    </footer>
  </div>
</div>
