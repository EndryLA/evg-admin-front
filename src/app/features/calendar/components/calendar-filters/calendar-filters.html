<div class="filters">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input
      #searchInput
      type="search"
      [value]="query()"
      (input)="onSearch($any($event.target).value)"
      placeholder="Rechercher un événement, un lieu…"
      aria-label="Rechercher un événement" />
  </div>

  <!-- Mobile-only trigger for the bottom filter drawer. -->
  <button type="button" class="filter-toggle" (click)="openDrawer()" aria-label="Filtres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
    Filtres
    @if (activeFilterCount() > 0) {
      <span class="filter-toggle__badge">{{ activeFilterCount() }}</span>
    }
  </button>

  <!-- Filter controls: inline on desktop, a bottom drawer on mobile. -->
  <div class="filter-controls" [class.filter-controls--open]="drawerOpen()">
    <div class="drawer-head">
      <h2 class="drawer-head__title">Filtres</h2>
      <button type="button" class="drawer-close" (click)="closeDrawer()" aria-label="Fermer les filtres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <div class="type-chips" role="group" aria-label="Filtrer par type">
        @for (t of typeOptions; track t.value) {
          <button
            type="button"
            class="type-chip type-chip--{{ t.value.toLowerCase() }}"
            [class.type-chip--active]="isTypeActive(t.value)"
            [attr.aria-pressed]="isTypeActive(t.value)"
            (click)="toggleType(t.value)">
            <span class="type-chip__dot" aria-hidden="true"></span>
            {{ t.label }}
          </button>
        }
      </div>

      <label class="filter-field">
        <span class="filter-field__label">Statut</span>
        <select
          class="filter-select"
          [value]="status()"
          (change)="setStatus($any($event.target).value)"
          aria-label="Filtrer par statut">
          <option value="ALL">Tous les statuts</option>
          @for (s of statusOptions; track s.value) {
            <option [value]="s.value">{{ s.label }}</option>
          }
        </select>
      </label>

      <label class="filter-field">
        <span class="filter-field__label">Responsable</span>
        <select
          class="filter-select"
          [value]="managedBy()"
          (change)="setManagedBy($any($event.target).value)"
          aria-label="Filtrer par responsable">
          <option value="ALL">Tous</option>
          @for (m of managers(); track m.uuid) {
            <option [value]="m.uuid">{{ m.label }}</option>
          }
        </select>
      </label>

      @if (hasActiveFilters()) {
        <button type="button" class="btn filter-reset" (click)="reset()">
          Réinitialiser
        </button>
      }
    </div>

    <div class="drawer-foot">
      <button type="button" class="btn btn--primary drawer-apply" (click)="closeDrawer()">
        Voir les résultats ({{ resultCount() }})
      </button>
    </div>
  </div>

  <!-- The kind is picked in the dialog this opens — an évangélisation and an
       event both start here. -->
  <button type="button" class="btn btn--primary new-btn" (click)="create.emit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Nouveau
  </button>
</div>

<!-- Backdrop behind the mobile filter drawer. -->
@if (drawerOpen()) {
  <button type="button" class="drawer-backdrop" (click)="closeDrawer()" aria-label="Fermer les filtres" tabindex="-1"></button>
}
