<div class="modal-overlay" (click)="cancel.emit()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-label="Clôturer la sortie"
    (click)="$event.stopPropagation()">

    <header class="modal__head">
      <span class="eyebrow">Fin de la sortie</span>
      <h2 class="modal__title">Clôturer la sortie</h2>
    </header>

    <div class="grid">
      @if (error(); as message) {
        <p class="alert alert--error field--span" role="alert">{{ message }}</p>
      }

      <p class="modal__lead field--span">
        La sortie sera marquée comme terminée. Indiquez d'abord le nombre total
        de personnes présentes sur le terrain.
      </p>

      <label class="field field--span">
        <span class="field__label">Nombre total de présences</span>
        <input
          class="field__control"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          autocomplete="off"
          placeholder="Ex. 24"
          [value]="total()"
          (input)="setTotal($any($event.target).value)"
          (blur)="markTouched()"
          [attr.aria-invalid]="touched() && invalid()"
          [attr.aria-describedby]="touched() && invalid() ? null : 'close-total-hint'" />
        @if (touched() && invalid()) {
          <span class="field__error">
            Renseignez un nombre entier de présences (0 ou plus).
          </span>
        } @else {
          <span class="field__hint" id="close-total-hint">
            {{ tracked() }} présence{{ tracked() > 1 ? 's' : '' }} enregistrée{{ tracked() > 1 ? 's' : '' }}
            via le formulaire — indiquez ici le comptage réel.
          </span>
        }
      </label>
    </div>

    <footer class="modal__foot">
      <button type="button" class="btn modal__cancel" (click)="cancel.emit()" [disabled]="busy()">
        Annuler
      </button>
      <button type="button" class="btn btn--primary" (click)="submit()" [disabled]="busy() || invalid()">
        {{ busy() ? 'Clôture…' : 'Clôturer la sortie' }}
      </button>
    </footer>
  </div>
</div>
